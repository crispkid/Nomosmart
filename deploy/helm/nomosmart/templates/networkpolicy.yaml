{{- if eq .Values.neo4j.mode "bundled" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nomosmart.fullname" . }}-neo4j-ingress
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
  annotations:
    nomosmart.io/accepted-risk: {{ .Values.acceptedRisks.changeId | quote }}
    nomosmart.io/risk-detail: "neo4j_community_admin_equivalent"
spec:
  podSelector:
    matchLabels:
      {{- include "nomosmart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: neo4j
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [backend, worker, deployment-bootstrap, deployment-finalize]
            matchLabels:
              {{- include "nomosmart.selectorLabels" . | nindent 14 }}
      ports: [{protocol: TCP, port: 7687}]
{{- end }}
{{- if eq .Values.keycloak.mode "bundled" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nomosmart.fullname" . }}-keycloak-ingress
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nomosmart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keycloak
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressController.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingressController.podSelector | nindent 12 }}
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [frontend, backend, worker, deployment-bootstrap, deployment-finalize]
            matchLabels:
              {{- include "nomosmart.selectorLabels" . | nindent 14 }}
      ports: [{protocol: TCP, port: 8080}]
    - from:
        - podSelector:
            matchLabels:
              {{- include "nomosmart.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: keycloak
      ports:
        - {protocol: TCP, port: 7800}
        - {protocol: TCP, port: 57800}
{{- end }}
{{- end }}
