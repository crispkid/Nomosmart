{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nomosmart.fullname" . }}-default-deny-ingress
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nomosmart.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nomosmart.fullname" . }}-frontend-ingress
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nomosmart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressController.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingressController.podSelector | nindent 12 }}
      ports: [{protocol: TCP, port: 3000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nomosmart.fullname" . }}-backend-ingress
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nomosmart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nomosmart.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: frontend
      ports: [{protocol: TCP, port: 8000}]
    {{- if eq (include "nomosmart.publicApiEnabled" .) "true" }}
    {{- if or (not .Values.networkPolicy.ingressController.namespaceSelector) (not .Values.networkPolicy.ingressController.podSelector) }}
    {{- fail "public API network access requires nonempty ingress controller namespaceSelector and podSelector" }}
    {{- end }}
    {{- range $selector := list .Values.networkPolicy.ingressController.namespaceSelector .Values.networkPolicy.ingressController.podSelector }}
    {{- if not (or $selector.matchLabels $selector.matchExpressions) }}
    {{- fail "public API network access requires actual controller label constraints, not an all-matching selector" }}
    {{- end }}
    {{- end }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressController.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingressController.podSelector | nindent 12 }}
      # Named target port follows Backend's container, not the Service port.
      ports: [{protocol: TCP, port: http}]
    {{- end }}
{{- if eq .Values.postgresql.mode "bundled" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nomosmart.fullname" . }}-postgresql-ingress
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nomosmart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [backend, worker, beat, migration, deployment-bootstrap, deployment-finalize, keycloak]
            matchLabels:
              {{- include "nomosmart.selectorLabels" . | nindent 14 }}
      ports: [{protocol: TCP, port: 5432}]
    {{- if .Values.postgresql.operator.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "nomosmart.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgresql
      ports: [{protocol: TCP, port: 5432}]
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports: [{protocol: TCP, port: 8000}]
    {{- end }}
{{- end }}
{{- if eq .Values.redis.mode "bundled" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nomosmart.fullname" . }}-redis-ingress
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nomosmart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [backend, worker, beat, deployment-bootstrap, deployment-finalize]
            matchLabels:
              {{- include "nomosmart.selectorLabels" . | nindent 14 }}
      ports: [{protocol: TCP, port: 6379}]
    {{- if .Values.redis.cluster.enabled }}
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [redis, redis-sentinel]
            matchLabels:
              {{- include "nomosmart.selectorLabels" . | nindent 14 }}
      ports: [{protocol: TCP, port: 6379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nomosmart.fullname" . }}-redis-sentinel-ingress
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nomosmart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis-sentinel
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [backend, worker, beat, redis-sentinel, deployment-bootstrap, deployment-finalize]
            matchLabels:
              {{- include "nomosmart.selectorLabels" . | nindent 14 }}
      ports: [{protocol: TCP, port: 26379}]
    {{- end }}
{{- end }}
