{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nomosmart.secretName" . }}
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{- if ne $key "DATABASE_URL" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- $postgresPassword := index .Values.secrets.data .Values.postgresql.auth.passwordSecretKey | urlquery }}
  {{- if and (eq .Values.postgresql.mode "bundled") .Values.postgresql.operator.enabled }}
  DATABASE_URL: {{ printf "postgresql+psycopg2://%s:%s@%s:%v/%s?sslmode=verify-full&sslrootcert=/etc/nomosmart/tls/postgresql-ca.crt" .Values.postgresql.auth.username $postgresPassword (include "nomosmart.postgresqlHost" .) .Values.postgresql.service.port .Values.postgresql.auth.database | quote }}
  {{- else if eq .Values.postgresql.mode "bundled" }}
  DATABASE_URL: {{ printf "postgresql+psycopg2://%s:%s@%s:%v/%s" .Values.postgresql.auth.username $postgresPassword (include "nomosmart.postgresqlHost" .) .Values.postgresql.service.port .Values.postgresql.auth.database | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.secrets.data.DATABASE_URL | quote }}
  {{- end }}
{{- end }}
{{- if and (not .Values.secrets.existingSecret) (eq .Values.postgresql.mode "bundled") .Values.postgresql.operator.enabled }}
{{- range $row := list
  (dict "name" .Values.postgresql.auth.superuserSecretName "username" .Values.postgresql.auth.adminUsername "key" .Values.postgresql.auth.adminPasswordSecretKey)
  (dict "name" .Values.postgresql.auth.ownerSecretName "username" .Values.postgresql.auth.migrationUsername "key" .Values.postgresql.auth.migrationPasswordSecretKey)
  (dict "name" .Values.postgresql.auth.appSecretName "username" .Values.postgresql.auth.username "key" .Values.postgresql.auth.passwordSecretKey)
  (dict "name" .Values.postgresql.auth.keycloakSecretName "username" .Values.postgresql.auth.keycloakUsername "key" .Values.postgresql.auth.keycloakPasswordSecretKey) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $row.name }}
  labels:
    {{- include "nomosmart.labels" $ | nindent 4 }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ $row.username | quote }}
  password: {{ index $.Values.secrets.data $row.key | quote }}
{{- end }}
{{- end }}
