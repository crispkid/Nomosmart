{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nomosmart.serviceAccountName" . }}
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and (include "nomosmart.applicationStageEnabled" .) .Values.beat.haEnabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nomosmart.fullname" . }}-beat
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
    app.kubernetes.io/component: beat
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nomosmart.fullname" . }}-beat-lease
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ .Values.beat.lease.name | quote }}]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nomosmart.fullname" . }}-beat-lease
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nomosmart.fullname" . }}-beat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nomosmart.fullname" . }}-beat-lease
{{- end }}
