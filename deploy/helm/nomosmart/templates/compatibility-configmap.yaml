apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nomosmart.fullname" . }}-compatibility
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
data:
  application_contract: {{ required "compatibility.applicationContract is required" .Values.compatibility.applicationContract | quote }}
  schema_contract: {{ required "compatibility.schemaContract is required" .Values.compatibility.schemaContract | quote }}
  public_api_contract: {{ required "compatibility.publicApiContract is required" .Values.compatibility.publicApiContract | quote }}
  security_contract: {{ required "compatibility.securityContract is required" .Values.compatibility.securityContract | quote }}
  scanner_free_ingestion: "true"
  password_only_authentication: "true"
