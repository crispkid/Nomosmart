{{- if include "nomosmart.applicationStageEnabled" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nomosmart.fullname" . }}-worker
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.highAvailability.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.highAvailability.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      {{- include "nomosmart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "nomosmart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        nomosmart.io/deployment-release: {{ printf "%s-%d" .Release.Name .Release.Revision | quote }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.highAvailability.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "nomosmart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "nomosmart.bootstrapEvidenceInitContainer" . | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command: ["celery", "-A", "app.worker.celery_app", "worker"]
          args: ["--loglevel=INFO", "--concurrency={{ .Values.worker.concurrency }}"]
          envFrom:
            - configMapRef:
                name: {{ include "nomosmart.fullname" . }}-config
          env:
            {{- include "nomosmart.runtimeSecretEnv" . | nindent 12 }}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "celery -A app.worker.celery_app inspect ping --destination celery@$HOSTNAME --timeout 5 | grep -q pong"]
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "celery -A app.worker.celery_app inspect ping --destination celery@$HOSTNAME --timeout 5 | grep -q pong"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          volumeMounts:
            {{- include "nomosmart.runtimeSecretVolumeMount" . | nindent 12 }}
            {{- include "nomosmart.internalCaVolumeMount" . | nindent 12 }}
          {{- if .Values.sftpKnownHosts.configMapName }}
            - name: sftp-known-hosts
              mountPath: /etc/nomosmart/ssh_known_hosts
              subPath: ssh_known_hosts
              readOnly: true
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        {{- include "nomosmart.runtimeSecretVolume" . | nindent 8 }}
        {{- include "nomosmart.internalCaVolume" . | nindent 8 }}
      {{- if .Values.sftpKnownHosts.configMapName }}
        - name: sftp-known-hosts
          configMap:
            name: {{ .Values.sftpKnownHosts.configMapName }}
            items:
              - key: {{ .Values.sftpKnownHosts.key }}
                path: ssh_known_hosts
      {{- end }}
      {{- if .Values.highAvailability.enabled }}
      affinity:
        {{- include "nomosmart.haAffinity" (dict "root" . "component" "worker") | nindent 8 }}
      {{- end }}
{{- end }}
