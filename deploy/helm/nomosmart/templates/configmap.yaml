{{- if or (hasKey .Values.backend.env "DEPLOYMENT_BOOTSTRAP_RELEASE") (hasKey .Values.frontend.env "DEPLOYMENT_BOOTSTRAP_RELEASE") }}
{{- fail "DEPLOYMENT_BOOTSTRAP_RELEASE is chart-managed and cannot be overridden" }}
{{- end }}
{{- range $env := list .Values.backend.env .Values.frontend.env }}
{{- range $name, $_ := $env }}
{{- if has (upper $name) (list "MIGRATION_REQUIRED_VERSION" "MIGRATION_REQUIRED_CHECKSUM" "MIGRATION_BASELINE_CHECKSUM" "MIGRATION_CHECK_TIMEOUT_SECONDS") }}
{{- fail (printf "%s is chart-managed; configure migration.* instead" $name) }}
{{- end }}
{{- end }}
{{- end }}
{{- $migrationVersion := toString .Values.migration.requiredVersion }}
{{- $migrationChecksum := toString .Values.migration.requiredChecksum }}
{{- $baselineChecksum := toString .Values.migration.baselineChecksum }}
{{- if ne (eq $migrationVersion "") (eq $migrationChecksum "") }}
{{- fail "migration.requiredVersion and requiredChecksum must be configured together" }}
{{- end }}
{{- if and (ne $migrationChecksum "") (or (lt (int64 $migrationChecksum) (int64 "-2147483648")) (gt (int64 $migrationChecksum) (int64 "2147483647"))) }}
{{- fail "migration.requiredChecksum must be a signed 32-bit Flyway checksum" }}
{{- end }}
{{- if and (ne $baselineChecksum "") (or (eq $migrationVersion "") (lt (int64 $baselineChecksum) (int64 "-2147483648")) (gt (int64 $baselineChecksum) (int64 "2147483647"))) }}
{{- fail "migration.baselineChecksum requires a target version and a signed 32-bit Flyway checksum" }}
{{- end }}
{{- $bootstrapEvidenceRelease := .Values.bootstrap.evidenceRelease | default (printf "%s-%d" .Release.Name .Release.Revision) }}
{{- $uploadSettings := include "nomosmart.uploadSettings" . | fromJson }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nomosmart.fullname" . }}-config
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
data:
  {{- range $key, $value := $uploadSettings }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  INSTALLER_DEPLOYMENT_STAGE: {{ .Values.installer.deploymentStage | quote }}
  INSTALLER_FINALIZATION_ENABLED: {{ .Values.bootstrap.finalize.enabled | quote }}
  DEPLOYMENT_BOOTSTRAP_RELEASE: {{ $bootstrapEvidenceRelease | quote }}
  MIGRATION_REQUIRED_VERSION: {{ .Values.migration.requiredVersion | quote }}
  MIGRATION_REQUIRED_CHECKSUM: {{ .Values.migration.requiredChecksum | quote }}
  MIGRATION_BASELINE_CHECKSUM: {{ .Values.migration.baselineChecksum | quote }}
  MIGRATION_CHECK_TIMEOUT_SECONDS: {{ .Values.migration.checkTimeoutSeconds | quote }}
  DEPLOYMENT_PHASE: {{ .Values.bootstrap.deploymentPhase | quote }}
  LOCAL_DEVELOPMENT_PLATFORM: {{ ternary .Values.localDevelopment.platform "disabled" .Values.localDevelopment.enabled | quote }}
  KNOWN_LOCAL_CREDENTIAL_RISK_ACCEPTED: {{ .Values.localDevelopment.knownCredentialRiskAccepted | quote }}
  ONBOARDING_ADMIN_ALLOW_CIDR: {{ .Values.bootstrap.onboardingAdminAllowCidr | quote }}
  NEO4J_COMMUNITY_ADMIN_EQUIVALENT_ACCEPTED: {{ .Values.acceptedRisks.neo4jCommunityAdminEquivalent | quote }}
  KUBERNETES_SECRET_MOUNT_ROOT: "/var/run/nomosmart-secrets"
  RUNTIME_SECRET_ALLOWED_REFS: {{ printf "%s#*" (include "nomosmart.secretName" .) | quote }}
  {{- $generatedBackend := list "REDIS_URL" "REDIS_SENTINEL_NODES" "CELERY_BROKER_URL" "CELERY_RESULT_BACKEND" "S3_ENDPOINT_URL" "S3_CA_CERT_PATH" "OPENSEARCH_URL" "OPENSEARCH_CA_CERT_PATH" "NEO4J_URI" "NEO4J_CA_CERT_PATH" "OIDC_ISSUER_URL" "OIDC_DISCOVERY_URL" "OIDC_JWKS_URL" "KEYCLOAK_ADMIN_API_URL" "KEYCLOAK_ADMIN_INTERNAL_URL" }}
  {{- range $key, $value := .Values.backend.env }}
  {{- if and (not (has $key $generatedBackend)) (not (hasKey $uploadSettings $key)) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- $generatedFrontend := list "NEXT_PUBLIC_APP_ORIGIN" "NEXT_PUBLIC_OIDC_ISSUER_URL" "FRONTEND_APP_ORIGIN" "FRONTEND_OIDC_ISSUER_URL" "FRONTEND_OIDC_INTERNAL_ISSUER_URL" }}
  {{- range $key, $value := .Values.frontend.env }}
  {{- if and (not (has $key $generatedFrontend)) (not (hasKey $uploadSettings $key)) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  NEXT_PUBLIC_APP_ORIGIN: {{ .Values.global.publicOrigin | quote }}
  FRONTEND_APP_ORIGIN: {{ .Values.global.publicOrigin | quote }}
  BACKEND_INTERNAL_API_BASE_URL: {{ printf "http://%s-backend:%v/api/v1" (include "nomosmart.fullname" .) .Values.backend.service.port | quote }}
  {{- if eq .Values.keycloak.mode "bundled" }}
  NEXT_PUBLIC_OIDC_ISSUER_URL: {{ printf "%s%s/realms/nomosmart" .Values.global.publicOrigin .Values.global.keycloakPath | quote }}
  FRONTEND_OIDC_ISSUER_URL: {{ printf "%s%s/realms/nomosmart" .Values.global.publicOrigin .Values.global.keycloakPath | quote }}
  FRONTEND_OIDC_INTERNAL_ISSUER_URL: {{ printf "http://%s-keycloak:%v%s/realms/nomosmart" (include "nomosmart.fullname" .) .Values.keycloak.service.httpPort .Values.global.keycloakPath | quote }}
  OIDC_ISSUER_URL: {{ printf "%s%s/realms/nomosmart" .Values.global.publicOrigin .Values.global.keycloakPath | quote }}
  OIDC_DISCOVERY_URL: {{ printf "http://%s-keycloak:%v%s/realms/nomosmart/.well-known/openid-configuration" (include "nomosmart.fullname" .) .Values.keycloak.service.httpPort .Values.global.keycloakPath | quote }}
  OIDC_JWKS_URL: {{ printf "http://%s-keycloak:%v%s/realms/nomosmart/protocol/openid-connect/certs" (include "nomosmart.fullname" .) .Values.keycloak.service.httpPort .Values.global.keycloakPath | quote }}
  KEYCLOAK_ADMIN_API_URL: {{ printf "%s%s" .Values.global.publicOrigin .Values.global.keycloakPath | quote }}
  KEYCLOAK_ADMIN_INTERNAL_URL: {{ printf "http://%s-keycloak:%v%s" (include "nomosmart.fullname" .) .Values.keycloak.service.httpPort .Values.global.keycloakPath | quote }}
  {{- else }}
  NEXT_PUBLIC_OIDC_ISSUER_URL: {{ .Values.keycloak.external.issuerUrl | quote }}
  FRONTEND_OIDC_ISSUER_URL: {{ .Values.keycloak.external.issuerUrl | quote }}
  FRONTEND_OIDC_INTERNAL_ISSUER_URL: {{ .Values.keycloak.external.internalIssuerUrl | default .Values.keycloak.external.issuerUrl | quote }}
  OIDC_ISSUER_URL: {{ .Values.keycloak.external.issuerUrl | quote }}
  OIDC_DISCOVERY_URL: {{ .Values.keycloak.external.discoveryUrl | quote }}
  OIDC_JWKS_URL: {{ .Values.keycloak.external.jwksUrl | quote }}
  KEYCLOAK_ADMIN_API_URL: {{ .Values.keycloak.external.adminApiUrl | quote }}
  KEYCLOAK_ADMIN_INTERNAL_URL: {{ .Values.keycloak.external.adminApiUrl | quote }}
  {{- end }}
  {{- if eq .Values.rustfs.mode "bundled" }}
  S3_ENDPOINT_URL: {{ printf "https://%s-rustfs:%v" (include "nomosmart.fullname" .) .Values.rustfs.service.port | quote }}
  S3_CA_CERT_PATH: "/etc/nomosmart/tls/rustfs-ca.crt"
  S3_POSTGRESQL_BACKUP_BUCKET: {{ .Values.postgresql.backup.bucket | quote }}
  {{- else }}
  S3_ENDPOINT_URL: {{ .Values.rustfs.external.url | quote }}
  {{- if .Values.rustfs.external.caSecretName }}
  S3_CA_CERT_PATH: "/etc/nomosmart/tls/rustfs-ca.crt"
  {{- end }}
  {{- end }}
  {{- if and (eq .Values.redis.mode "bundled") .Values.redis.cluster.enabled }}
  REDIS_SENTINEL_NODES: {{ printf "%s-redis-sentinel:%v" (include "nomosmart.fullname" .) .Values.redis.service.sentinelPort | quote }}
  {{- end }}
  {{- if eq .Values.opensearch.mode "bundled" }}
  OPENSEARCH_URL: {{ printf "https://%s-opensearch:%v" (include "nomosmart.fullname" .) .Values.opensearch.service.port | quote }}
  OPENSEARCH_CA_CERT_PATH: "/etc/nomosmart/tls/opensearch-ca.crt"
  {{- else }}
  OPENSEARCH_URL: {{ .Values.opensearch.external.url | quote }}
  {{- if .Values.opensearch.external.caSecretName }}
  OPENSEARCH_CA_CERT_PATH: "/etc/nomosmart/tls/opensearch-ca.crt"
  {{- end }}
  {{- end }}
  {{- if eq .Values.neo4j.mode "bundled" }}
  NEO4J_URI: {{ printf "bolt://%s-neo4j:%v" (include "nomosmart.fullname" .) .Values.neo4j.service.boltPort | quote }}
  {{- else }}
  NEO4J_URI: {{ .Values.neo4j.external.uri | quote }}
  {{- if .Values.neo4j.external.caSecretName }}
  {{- if not (regexMatch "^(bolt|neo4j)\\+s://" .Values.neo4j.external.uri) }}
  {{- fail "neo4j.external.caSecretName requires a strict TLS (+s) URI" }}
  {{- end }}
  NEO4J_CA_CERT_PATH: "/etc/nomosmart/tls/neo4j-ca.crt"
  {{- end }}
  {{- end }}
