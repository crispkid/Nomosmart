{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nomosmart.fullname" . }}
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations (ne .Values.bootstrap.deploymentPhase "operational") }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if ne .Values.bootstrap.deploymentPhase "operational" }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.bootstrap.onboardingAdminAllowCidr | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- if eq .service "keycloak" }}
          {{- fail "Keycloak ingress targets were removed; use the application service and configure external OIDC separately" }}
          {{- end }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "nomosmart.fullname" $ }}-{{ .service }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
