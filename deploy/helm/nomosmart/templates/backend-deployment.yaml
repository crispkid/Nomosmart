{{- if include "nomosmart.applicationStageEnabled" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nomosmart.fullname" . }}-backend
  labels:
    {{- include "nomosmart.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount.backend }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.highAvailability.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.highAvailability.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      {{- include "nomosmart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "nomosmart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        nomosmart.io/deployment-release: {{ printf "%s-%d" .Release.Name .Release.Revision | quote }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.highAvailability.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "nomosmart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "nomosmart.bootstrapInitContainer" . | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "nomosmart.fullname" . }}-config
          env:
            {{- include "nomosmart.runtimeSecretEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "nomosmart.runtimeSecretVolumeMount" . | nindent 12 }}
            {{- include "nomosmart.internalCaVolumeMount" . | nindent 12 }}
          {{- if .Values.sftpKnownHosts.configMapName }}
            - name: sftp-known-hosts
              mountPath: /etc/nomosmart/ssh_known_hosts
              subPath: ssh_known_hosts
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        {{- include "nomosmart.runtimeSecretVolume" . | nindent 8 }}
        {{- include "nomosmart.internalCaVolume" . | nindent 8 }}
      {{- if .Values.sftpKnownHosts.configMapName }}
        - name: sftp-known-hosts
          configMap:
            name: {{ .Values.sftpKnownHosts.configMapName }}
            items:
              - key: {{ .Values.sftpKnownHosts.key }}
                path: ssh_known_hosts
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.highAvailability.enabled }}
      affinity:
        {{- include "nomosmart.haAffinity" (dict "root" . "component" "backend") | nindent 8 }}
      {{- else }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
