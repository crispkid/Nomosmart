# Docker Desktop-only development/factory profile (DEPLOY-020).
# The known credentials below are public local defaults, not production
# secrets. OpenSearch and cryptographic placeholders must be replaced from
# owner-only package files before Helm is allowed to render this profile.
deploymentProfile: bundled

localDevelopment:
  enabled: true
  platform: docker-desktop
  knownCredentialRiskAccepted: true

installer:
  deploymentStage: foundation

replicaCount:
  frontend: 1
  backend: 1
  worker: 1

highAvailability:
  enabled: false

productionCapacity:
  enabled: false

image:
  frontend:
    tag: "0.1.0-chg280"
  backend:
    tag: "0.1.0-chg278"
  migration:
    tag: "0.1.0-chg267"

backend:
  env:
    APP_ENV: development
    REDIS_HA_MODE: sentinel
    REDIS_SENTINEL_MASTER_NAME: nomosmart
    REDIS_SENTINEL_USERNAME: nomosmart
    REDIS_TLS_CA_CERT_PATH: /etc/nomosmart/tls/redis-ca.crt

migration:
  jdbcUrl: jdbc:postgresql://nomosmart-local-postgresql:5432/nomosmart

bootstrap:
  keycloakMode: manage
  deploymentPhase: factory_acceptance
  onboardingAdminAllowCidr: 127.0.0.1/32,10.244.0.0/16

ingress:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/whitelist-source-range: 127.0.0.1/32,10.244.0.0/16

secrets:
  existingSecret: ""
  data:
    APP_ENCRYPTION_KEY: CHANGE_ME_LOCAL_RANDOM_APP_ENCRYPTION_KEY
    DATABASE_URL: postgresql+psycopg2://nomosmart:P%40ssw0rd@nomosmart-local-postgresql:5432/nomosmart
    DATABASE_MIGRATION_USER: nomosmart
    DATABASE_MIGRATION_PASSWORD: P@ssw0rd
    POSTGRES_ADMIN_PASSWORD: P@ssw0rd
    POSTGRES_PASSWORD: P@ssw0rd
    POSTGRES_MIGRATION_PASSWORD: P@ssw0rd
    KEYCLOAK_DB_PASSWORD: P@ssw0rd
    KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: nomosmart
    KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: P@ssw0rd
    S3_ACCESS_KEY_ID: nomosmart
    S3_SECRET_ACCESS_KEY: P@ssw0rd
    REDIS_PASSWORD: P@ssw0rd
    REDIS_REPLICATION_PASSWORD: P@ssw0rd
    REDIS_SENTINEL_PASSWORD: P@ssw0rd
    REDIS_URL: sentinel://nomosmart:P%40ssw0rd@nomosmart-local-redis-sentinel:26379/0
    CELERY_BROKER_URL: sentinel://nomosmart:P%40ssw0rd@nomosmart-local-redis-sentinel:26379/0
    CELERY_RESULT_BACKEND: sentinel://nomosmart:P%40ssw0rd@nomosmart-local-redis-sentinel:26379/1
    OPENSEARCH_ADMIN_PASSWORD: CHANGE_ME_LOCAL_RANDOM_OPENSEARCH_ADMIN_PASSWORD
    OPENSEARCH_PASSWORD: CHANGE_ME_LOCAL_RANDOM_OPENSEARCH_SERVICE_PASSWORD
    NEO4J_ADMIN_PASSWORD: P@ssw0rd
    NEO4J_PASSWORD: P@ssw0rd
    NEO4J_AUTH: neo4j/P@ssw0rd
    OIDC_CLIENT_SECRET: CHANGE_ME_LOCAL_RANDOM_OIDC_CLIENT_SECRET
    KEYCLOAK_SYNC_CLIENT_SECRET: CHANGE_ME_LOCAL_RANDOM_KEYCLOAK_SYNC_CLIENT_SECRET
    BREAK_GLASS_INITIAL_PASSWORD: P@ssw0rd

postgresql:
  operator:
    enabled: false
  persistence:
    enabled: true
    size: 5Gi

redis:
  cluster:
    enabled: true
    replicas: 3
    sentinelReplicas: 3
    sentinelQuorum: 2
    masterName: nomosmart
    topologyKey: kubernetes.io/hostname
    podDisruptionBudget:
      minAvailable: 2
    sentinelPodDisruptionBudget:
      minAvailable: 2
  persistence:
    enabled: true
    size: 2Gi
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

rustfs:
  cluster:
    enabled: false
    replicas: 1
    dataShards: 1
    parityShards: 0
  persistence:
    enabled: true
    size: 10Gi

opensearch:
  cluster:
    replicas: 1
    bootstrapMode: single-node
    podDisruptionBudget:
      minAvailable: 1
  persistence:
    enabled: true
    size: 10Gi

neo4j:
  persistence:
    enabled: true
    size: 5Gi

keycloak:
  adminIngress:
    annotations:
      nginx.ingress.kubernetes.io/whitelist-source-range: 127.0.0.1/32,10.244.0.0/16
  cache:
    mode: local
    stack: ""
  cluster:
    replicas: 1
    podDisruptionBudget:
      minAvailable: 1

beat:
  haEnabled: false
  replicas: 1
