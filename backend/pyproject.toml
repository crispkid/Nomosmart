[project]
name = "nomosmart-backend"
version = "0.1.0"
description = "NomoSmart v1 Backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery[redis]>=5.5,<6",
  "cryptography>=50.0.0,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "ldap-filter>=1.0.1,<2",
  "markdown-it-py>=4,<5",
  "neo4j>=5,<6",
  "paramiko>=5,<6",
  "psycopg2-binary>=2.9,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-cov>=6.2,<7",
]

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/db/models.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
