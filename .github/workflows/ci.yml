# CHG-424 OPT424-002: build-level checks only. Test suites, specifications and
# the harness are kept local-only and are run on developer machines.
name: ci

on:
  push:
    branches: [main, "optimize/**", "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python -m compileall -q main.py models.py migrate.py app scripts
      - run: uv run python -c "import main, app.worker; print(main.app.title)"

  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - run: docker compose config --no-env-resolution --quiet
      - run: helm lint deploy/helm/nomosmart
      - run: helm template nomosmart deploy/helm/nomosmart > /dev/null

  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          tags: nomosmart/${{ matrix.service }}:ci
