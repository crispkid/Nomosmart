  <text x="1688" y="400" fill="#245F46" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="44" font-weight="700">星圖實印</text>
  <text x="1688" y="445" fill="#66746E" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="22">集中、成熟、數位原生</text>
  <line x1="1688" y1="474" x2="2240" y2="474" stroke="#E2EAE6" stroke-width="2"/>
  <text x="1688" y="520" fill="#263438" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="22">深綠底把節點收進統一知識中心，</text>
  <text x="1688" y="556" fill="#263438" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="22">縮小後仍有最強輪廓，適合產品圖示。</text>
  <g transform="translate(1688 606)">
    <rect width="154" height="48" rx="24" fill="#EAF7F1"/>
    <text x="77" y="31" text-anchor="middle" fill="#245F46" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="18" font-weight="700">App icon</text>
    <rect x="170" width="154" height="48" rx="24" fill="#F5F0D9"/>
    <text x="247" y="31" text-anchor="middle" fill="#786720" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="18" font-weight="700">瀏覽器圖示</text>
  </g>
  <use href="#mark-solid" x="2154" y="628" width="92" height="92"/>
  <text x="2200" y="746" text-anchor="middle" fill="#7B8882" font-family="Arial, sans-serif" font-size="15">48 PX TEST</text>

