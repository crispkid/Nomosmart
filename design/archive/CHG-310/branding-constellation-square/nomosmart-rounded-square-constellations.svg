  <text x="1688" y="1005" fill="#66746E" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="22">精準、辨識、技術深度</text>
  <line x1="1688" y1="1034" x2="2240" y2="1034" stroke="#E2EAE6" stroke-width="2"/>
  <text x="1688" y="1080" fill="#263438" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="22">柔和方框包住不規則切面與核心，</text>
  <text x="1688" y="1116" fill="#263438" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="22">最能呼應「圓形輪廓中仍保留稜角」。</text>
  <g transform="translate(1688 1166)">
    <rect width="154" height="48" rx="24" fill="#F5F0D9"/>
    <text x="77" y="31" text-anchor="middle" fill="#786720" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="18" font-weight="700">技術品牌</text>
    <rect x="170" width="154" height="48" rx="24" fill="#EAF7F1"/>
    <text x="247" y="31" text-anchor="middle" fill="#245F46" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="18" font-weight="700">AI 核心</text>
