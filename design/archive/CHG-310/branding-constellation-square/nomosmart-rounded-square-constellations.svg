      <circle cx="65" cy="85" r="9" fill="#245F46" stroke="#FCFDFB" stroke-width="4"/>
      <circle cx="178" cy="82" r="9" fill="#64B4C8" stroke="#FCFDFB" stroke-width="4"/>
      <circle cx="80" cy="172" r="9" fill="#5FAE88" stroke="#FCFDFB" stroke-width="4"/>
      <circle cx="173" cy="163" r="9" fill="#D8C77A" stroke="#FCFDFB" stroke-width="4"/>
      <path d="M120 95 145 120 120 145 95 120Z" fill="#245F46" stroke="#FCFDFB" stroke-width="6"/>
      <path d="M120 105 135 120 120 135 105 120Z" fill="url(#goldCore)"/>
