  </g>
  <rect x="90" y="830" width="10" height="520" rx="5" fill="#64B4C8"/>
  <text x="134" y="885" fill="#7B8882" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">03 · LAYERED FRAME</text>
