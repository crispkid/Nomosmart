      <path d="M52 73 120 38 188 73 202 147 151 200 75 191 38 130Z" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="5"/>
      <ellipse cx="120" cy="120" rx="75" ry="41" transform="rotate(-23 120 120)" fill="none" stroke="#7DCCDC" stroke-width="8"/>
      <ellipse cx="120" cy="120" rx="72" ry="40" transform="rotate(57 120 120)" fill="none" stroke="#A8D7C2" stroke-width="7"/>
      <path d="M63 82 120 120 181 79M120 120 77 174M120 120 172 165" fill="none" stroke="#FCFDFB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="63" cy="82" r="11" fill="#EAF7F1" stroke="#245F46" stroke-width="5"/>
      <circle cx="181" cy="79" r="11" fill="#77C5D8" stroke="#245F46" stroke-width="5"/>
      <circle cx="77" cy="174" r="11" fill="#5FAE88" stroke="#245F46" stroke-width="5"/>
      <circle cx="172" cy="165" r="11" fill="#E5CD68" stroke="#245F46" stroke-width="5"/>
