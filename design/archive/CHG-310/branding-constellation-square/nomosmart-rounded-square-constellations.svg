    <symbol id="mark-faceted" viewBox="0 0 240 240">
      <rect x="13" y="13" width="214" height="214" rx="43" fill="url(#mintSurface)"/>
      <path d="M88 27H152L204 66 219 118 198 176 151 213H88L40 183 21 124 39 69Z" fill="none" stroke="#245F46" stroke-width="11" stroke-linejoin="round"/>
      <path d="M120 43 177 63 200 111 187 167 148 197 91 194 49 159 42 104 68 61Z" fill="none" stroke="#77C5D8" stroke-width="6" stroke-linejoin="round"/>
      <path d="M68 61 120 120 177 63M120 120 49 159M120 120 187 167M120 43V120" fill="none" stroke="#9ECDB7" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="120" cy="120" rx="71" ry="37" transform="rotate(-20 120 120)" fill="none" stroke="#5FAE88" stroke-width="7"/>
      <circle cx="68" cy="61" r="9" fill="#245F46" stroke="#FCFDFB" stroke-width="4"/>
      <circle cx="177" cy="63" r="9" fill="#64B4C8" stroke="#FCFDFB" stroke-width="4"/>
      <circle cx="49" cy="159" r="9" fill="#5FAE88" stroke="#FCFDFB" stroke-width="4"/>
      <circle cx="187" cy="167" r="9" fill="#D8C77A" stroke="#FCFDFB" stroke-width="4"/>
