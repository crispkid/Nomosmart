      <ellipse cx="120" cy="120" rx="72" ry="40" transform="rotate(-23 120 120)" fill="none" stroke="url(#blueOrbit)" stroke-width="8"/>
      <ellipse cx="120" cy="120" rx="70" ry="39" transform="rotate(57 120 120)" fill="none" stroke="#77B99B" stroke-width="7"/>
      <path d="M66 83 120 120 178 82M120 120 78 172M120 120 170 165" fill="none" stroke="#245F46" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="66" cy="83" r="10" fill="#245F46" stroke="#FCFDFB" stroke-width="5"/>
      <circle cx="178" cy="82" r="10" fill="#61B5C8" stroke="#FCFDFB" stroke-width="5"/>
      <circle cx="78" cy="172" r="10" fill="#5FAE88" stroke="#FCFDFB" stroke-width="5"/>
      <circle cx="170" cy="165" r="10" fill="#D8C77A" stroke="#FCFDFB" stroke-width="5"/>
      <path d="M120 96 145 120 120 144 95 120Z" fill="url(#goldCore)" stroke="#FCFDFB" stroke-width="6"/>
