    <linearGradient id="goldCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1DC84"/>
      <stop offset="1" stop-color="#C8A343"/>
    </linearGradient>

    <symbol id="mark-outline" viewBox="0 0 240 240">
