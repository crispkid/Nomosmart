  <rect width="2400" height="1500" fill="#F3F7F5"/>
  <rect width="2400" height="18" fill="#245F46"/>
  <circle cx="2228" cy="116" r="54" fill="none" stroke="#BFDCCE" stroke-width="2"/>
  <circle cx="2228" cy="116" r="31" fill="none" stroke="#77C5D8" stroke-width="2"/>
  <path d="M2185 94 2228 116 2271 91M2228 116 2257 153" fill="none" stroke="#5FAE88" stroke-width="3"/>
  <circle cx="2185" cy="94" r="6" fill="#245F46"/>
  <circle cx="2271" cy="91" r="6" fill="#64B4C8"/>
  <circle cx="2257" cy="153" r="6" fill="#D8C77A"/>

  <text x="90" y="102" fill="#245F46" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">NOMOSMART BRAND EXPLORATION · 04</text>
  <text x="90" y="172" fill="#263438" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="58" font-weight="700">圓角方形 × 知識星圖</text>
  <text x="90" y="216" fill="#66746E" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="24">穩定的企業容器，承載流動的知識軌道；圓角親和，內部稜角清楚而可信。</text>

  <!-- Card 01 -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="270" width="1080" height="520" rx="28" fill="#FCFDFB"/>
  </g>
  <rect x="90" y="270" width="10" height="520" rx="5" fill="#5FAE88"/>
  <text x="134" y="325" fill="#7B8882" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">01 · OUTLINE SQUIRCLE</text>
  <g filter="url(#iconShadow)">
    <use href="#mark-outline" x="145" y="358" width="340" height="340"/>
  </g>
  <text x="548" y="400" fill="#245F46" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="44" font-weight="700">星圖線框</text>
  <text x="548" y="445" fill="#66746E" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="22">清楚、開放、可信</text>
  <line x1="548" y1="474" x2="1100" y2="474" stroke="#E2EAE6" stroke-width="2"/>
  <text x="548" y="520" fill="#263438" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="22">雙層圓角框象徵治理邊界，</text>
  <text x="548" y="556" fill="#263438" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="22">交錯軌道代表知識被連結、驗證與使用。</text>
  <g transform="translate(548 606)">
    <rect width="154" height="48" rx="24" fill="#EAF7F1"/>
    <text x="77" y="31" text-anchor="middle" fill="#245F46" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="18" font-weight="700">品牌主識別</text>
    <rect x="170" width="154" height="48" rx="24" fill="#E9F5F8"/>
    <text x="247" y="31" text-anchor="middle" fill="#347F91" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="18" font-weight="700">文件與簡報</text>
  </g>
  <use href="#mark-outline" x="1014" y="628" width="92" height="92"/>
  <text x="1060" y="746" text-anchor="middle" fill="#7B8882" font-family="Arial, sans-serif" font-size="15">48 PX TEST</text>

  <!-- Card 02 -->
  <g filter="url(#cardShadow)">
    <rect x="1230" y="270" width="1080" height="520" rx="28" fill="#FCFDFB"/>
  </g>
  <rect x="1230" y="270" width="10" height="520" rx="5" fill="#245F46"/>
  <text x="1274" y="325" fill="#7B8882" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">02 · SOLID SQUIRCLE</text>
