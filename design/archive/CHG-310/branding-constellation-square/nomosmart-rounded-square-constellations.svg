  <g filter="url(#cardShadow)">
    <rect x="1230" y="830" width="1080" height="520" rx="28" fill="#FCFDFB"/>
  </g>
  <rect x="1230" y="830" width="10" height="520" rx="5" fill="#D8C77A"/>
  <text x="1274" y="885" fill="#7B8882" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">04 · FACETED CORE</text>
