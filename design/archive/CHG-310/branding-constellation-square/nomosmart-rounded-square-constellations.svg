    <use href="#mark-layered" x="145" y="918" width="340" height="340"/>
  </g>
  <text x="548" y="960" fill="#245F46" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="44" font-weight="700">雙層星框</text>
  <text x="548" y="1005" fill="#66746E" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="22">結構、層次、企業治理</text>
  <line x1="548" y1="1034" x2="1100" y2="1034" stroke="#E2EAE6" stroke-width="2"/>
  <text x="548" y="1080" fill="#263438" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="22">圓角框內再建立六角知識結構，</text>
  <text x="548" y="1116" fill="#263438" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="22">呈現多來源匯入、治理與知識圖譜關係。</text>
  <g transform="translate(548 1166)">
    <rect width="154" height="48" rx="24" fill="#E9F5F8"/>
