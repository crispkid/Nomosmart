<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">NomoSmart 圓角方形知識星圖 Logo 提案</title>
  <desc id="desc">四款以圓角方形為輪廓，結合知識軌道、節點、治理框架與稜角核心的企業級 Logo。</desc>

  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#173B2D" flood-opacity=".10"/>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#143B2B" flood-opacity=".16"/>
    </filter>
    <linearGradient id="solidGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#347A5B"/>
      <stop offset=".52" stop-color="#245F46"/>
      <stop offset="1" stop-color="#173F30"/>
    </linearGradient>
    <linearGradient id="mintSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFDFB"/>
      <stop offset="1" stop-color="#EAF7F1"/>
    </linearGradient>
    <linearGradient id="blueOrbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9AD9E5"/>
      <stop offset="1" stop-color="#55AEC3"/>
