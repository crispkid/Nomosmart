  <use href="#mark-faceted" x="2154" y="1188" width="92" height="92"/>
  <text x="2200" y="1306" text-anchor="middle" fill="#7B8882" font-family="Arial, sans-serif" font-size="15">48 PX TEST</text>

  <line x1="90" y1="1409" x2="2310" y2="1409" stroke="#D8E3DE" stroke-width="2"/>
  <text x="90" y="1452" fill="#245F46" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="1">NomoSmart</text>
  <text x="250" y="1452" fill="#66746E" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="20">治理，讓知識可信；AI，讓知識可用。</text>
  <text x="2310" y="1452" text-anchor="end" fill="#7B8882" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">ROUNDED-SQUARE CONSTELLATION STUDY</text>
