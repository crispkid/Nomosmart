    <text x="247" y="31" text-anchor="middle" fill="#245F46" font-family="Noto Sans TC, PingFang TC, Arial, sans-serif" font-size="18" font-weight="700">知識圖譜</text>
  </g>
  <use href="#mark-layered" x="1014" y="1188" width="92" height="92"/>
  <text x="1060" y="1306" text-anchor="middle" fill="#7B8882" font-family="Arial, sans-serif" font-size="15">48 PX TEST</text>

