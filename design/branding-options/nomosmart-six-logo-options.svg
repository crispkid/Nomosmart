    <rect x="90" y="270" width="690" height="590" rx="26" fill="#FCFDFB" stroke="#DCE5E0"/>
  </g>
  <text x="130" y="320" fill="#2F7D57" font-family="Avenir Next, sans-serif" font-size="14" font-weight="700" letter-spacing="2.2">01 · KNOWLEDGE GATEWAY</text>
  <rect x="130" y="360" width="220" height="220" rx="34" fill="#EAF7F1"/>
  <g transform="translate(176 405) scale(1)">
    <use href="#mark-gateway"/>
  </g>
  <g transform="translate(665 302) scale(.25)">
    <use href="#mark-gateway"/>
  </g>
  <text x="390" y="432" fill="#29373B" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="700">知識閘門</text>
  <text x="390" y="470" fill="#6D7B78" font-family="Avenir Next, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">GOVERNED CENTER</text>
  <text x="390" y="520" fill="#52615D" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="18">清楚表達「有治理邊界的</text>
  <text x="390" y="550" fill="#52615D" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="18">可信知識中心」。</text>
  <line x1="130" y1="625" x2="740" y2="625" stroke="#E1E8E4"/>
  <g transform="translate(130 665) scale(.54)">
    <use href="#mark-gateway"/>
  </g>
  <text x="220" y="710" fill="#29373B" font-family="Avenir Next, sans-serif" font-size="31" font-weight="650" letter-spacing="-1">NomoSmart</text>
  <text x="222" y="738" fill="#7A8783" font-family="Avenir Next, sans-serif" font-size="12" font-weight="650" letter-spacing="2">ENTERPRISE KNOWLEDGE CENTER</text>
  <rect x="130" y="780" width="104" height="34" rx="17" fill="#EAF7F1"/><text x="182" y="803" fill="#2F7D57" text-anchor="middle" font-family="PingFang TC, sans-serif" font-size="14" font-weight="650">治理明確</text>
  <rect x="245" y="780" width="104" height="34" rx="17" fill="#EEF6F8"/><text x="297" y="803" fill="#397E90" text-anchor="middle" font-family="PingFang TC, sans-serif" font-size="14" font-weight="650">中心意象</text>

