<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1650" role="img" aria-labelledby="title desc">
  <title id="title">Six professional NomoSmart logo options</title>
  <desc id="desc">Six simple, clear and professional logo directions for NomoSmart.</desc>
  <defs>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="126%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#28463A" flood-opacity=".07"/>
    </filter>

    <!-- 01 Knowledge Gateway -->
    <g id="mark-gateway">
      <path d="M48 25H42C30 25 21 34 21 46v36c0 12 9 21 21 21h6"
            fill="none" stroke="#245F46" stroke-width="16" stroke-linecap="round"/>
      <path d="M80 25h6c12 0 21 9 21 21v36c0 12-9 21-21 21h-6"
            fill="none" stroke="#5FAE88" stroke-width="16" stroke-linecap="round"/>
      <circle cx="64" cy="64" r="17" fill="#DCEFF3"/>
      <rect x="54" y="54" width="20" height="20" rx="5" transform="rotate(45 64 64)"
            fill="#D8C77A" stroke="#FCFDFB" stroke-width="4"/>
    </g>

    <!-- 02 Curated Layers -->
    <g id="mark-layers">
      <rect x="17" y="23" width="94" height="25" rx="12.5" fill="#245F46"/>
      <rect x="25" y="52" width="86" height="25" rx="12.5" fill="#5FAE88"/>
      <rect x="33" y="81" width="78" height="25" rx="12.5" fill="#77C5D8"/>
      <rect x="84" y="28" width="18" height="15" rx="5" fill="#D8C77A" stroke="#FCFDFB" stroke-width="3"/>
    </g>

    <!-- 03 Trust Lens -->
    <g id="mark-lens">
      <path d="M64 18A46 46 0 0 0 64 110" fill="none" stroke="#245F46" stroke-width="17" stroke-linecap="round"/>
      <path d="M64 18A46 46 0 0 1 64 110" fill="none" stroke="#5FAE88" stroke-width="17" stroke-linecap="round"/>
      <circle cx="64" cy="64" r="19" fill="#DCEFF3"/>
      <circle cx="64" cy="64" r="10" fill="#D8C77A"/>
    </g>

    <!-- 04 Intelligence Convergence -->
    <g id="mark-convergence">
      <rect x="26" y="26" width="76" height="76" rx="20" transform="rotate(-14 64 64)"
            fill="none" stroke="#245F46" stroke-width="14"/>
      <rect x="26" y="26" width="76" height="76" rx="20" transform="rotate(14 64 64)"
            fill="none" stroke="#77C5D8" stroke-width="14"/>
      <rect x="54" y="54" width="20" height="20" rx="5" transform="rotate(45 64 64)"
            fill="#D8C77A" stroke="#FCFDFB" stroke-width="4"/>
    </g>

    <!-- 05 Open Archive -->
    <g id="mark-archive">
      <path d="M16 29Q40 21 59 37V103Q40 87 16 94Z" fill="#245F46"/>
      <path d="M112 29Q88 21 69 37V103Q88 87 112 94Z" fill="#5FAE88"/>
      <path d="M64 18c1.2 8.5 6.5 13.8 15 15-8.5 1.2-13.8 6.5-15 15-1.2-8.5-6.5-13.8-15-15 8.5-1.2 13.8-6.5 15-15Z" fill="#D8C77A"/>
    </g>

    <!-- 06 Trusted Link -->
    <g id="mark-link">
      <rect x="16" y="34" width="70" height="40" rx="20" transform="rotate(-34 51 54)"
            fill="none" stroke="#245F46" stroke-width="14"/>
      <rect x="42" y="54" width="70" height="40" rx="20" transform="rotate(-34 77 74)"
            fill="none" stroke="#FCFDFB" stroke-width="22"/>
      <rect x="42" y="54" width="70" height="40" rx="20" transform="rotate(-34 77 74)"
            fill="none" stroke="#77C5D8" stroke-width="14"/>
      <circle cx="64" cy="64" r="9" fill="#D8C77A" stroke="#FCFDFB" stroke-width="3"/>
    </g>
  </defs>

  <rect width="2400" height="1650" fill="#F4F7F5"/>
  <rect width="2400" height="12" fill="#245F46"/>
  <circle cx="2260" cy="90" r="250" fill="#EAF7F1"/>

  <text x="90" y="88" fill="#2F7D57" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif"
        font-size="16" font-weight="700" letter-spacing="4.5">NOMOSMART · PROFESSIONAL LOGO DIRECTIONS</text>
  <text x="90" y="160" fill="#29373B" font-family="PingFang TC, Noto Sans TC, Helvetica Neue, sans-serif"
        font-size="48" font-weight="700">六個簡單、清楚、可落地的設計方向</text>
  <text x="92" y="208" fill="#65736F" font-family="PingFang TC, Noto Sans TC, Helvetica Neue, sans-serif"
        font-size="21">不使用字母造型 · 不使用 AI 腦袋 · 以企業知識中心的核心價值建立識別</text>

