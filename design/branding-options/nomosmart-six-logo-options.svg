  <text x="1155" y="432" fill="#29373B" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="700">知識層級</text>
  <text x="1155" y="470" fill="#6D7B78" font-family="Avenir Next, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">CURATED LAYERS</text>
