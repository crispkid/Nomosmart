  </g>
  <text x="985" y="710" fill="#29373B" font-family="Avenir Next, sans-serif" font-size="31" font-weight="650" letter-spacing="-1">NomoSmart</text>
  <text x="987" y="738" fill="#7A8783" font-family="Avenir Next, sans-serif" font-size="12" font-weight="650" letter-spacing="2">KNOWLEDGE, ORGANIZED</text>
  <rect x="895" y="780" width="104" height="34" rx="17" fill="#EAF7F1"/><text x="947" y="803" fill="#2F7D57" text-anchor="middle" font-family="PingFang TC, sans-serif" font-size="14" font-weight="650">結構清楚</text>
  <rect x="1010" y="780" width="104" height="34" rx="17" fill="#EEF6F8"/><text x="1062" y="803" fill="#397E90" text-anchor="middle" font-family="PingFang TC, sans-serif" font-size="14" font-weight="650">資料意象</text>

