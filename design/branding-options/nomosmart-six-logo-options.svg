  <rect x="130" y="1420" width="104" height="34" rx="17" fill="#EAF7F1"/><text x="182" y="1443" fill="#2F7D57" text-anchor="middle" font-family="PingFang TC, sans-serif" font-size="14" font-weight="650">科技理性</text>
  <rect x="245" y="1420" width="104" height="34" rx="17" fill="#EEF6F8"/><text x="297" y="1443" fill="#397E90" text-anchor="middle" font-family="PingFang TC, sans-serif" font-size="14" font-weight="650">雙重能力</text>

