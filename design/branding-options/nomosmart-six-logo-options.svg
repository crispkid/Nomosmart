  <text x="1155" y="1110" fill="#6D7B78" font-family="Avenir Next, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">OPEN ARCHIVE</text>
  <text x="1155" y="1160" fill="#52615D" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="18">最直接的知識意象，適合強調</text>
  <text x="1155" y="1190" fill="#52615D" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="18">企業資料累積與傳承。</text>
