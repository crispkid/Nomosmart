  </g>
  <text x="985" y="1350" fill="#29373B" font-family="Avenir Next, sans-serif" font-size="31" font-weight="650" letter-spacing="-1">NomoSmart</text>
  <text x="987" y="1378" fill="#7A8783" font-family="Avenir Next, sans-serif" font-size="12" font-weight="650" letter-spacing="2">ENTERPRISE KNOWLEDGE</text>
  <rect x="895" y="1420" width="104" height="34" rx="17" fill="#EAF7F1"/><text x="947" y="1443" fill="#2F7D57" text-anchor="middle" font-family="PingFang TC, sans-serif" font-size="14" font-weight="650">一眼理解</text>
  <rect x="1010" y="1420" width="104" height="34" rx="17" fill="#FFF5D7"/><text x="1062" y="1443" fill="#8A7425" text-anchor="middle" font-family="PingFang TC, sans-serif" font-size="14" font-weight="650">知識意象</text>

