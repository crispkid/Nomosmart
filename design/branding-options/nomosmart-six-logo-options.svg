  <rect x="1660" y="1420" width="104" height="34" rx="17" fill="#EEF6F8"/><text x="1712" y="1443" fill="#397E90" text-anchor="middle" font-family="PingFang TC, sans-serif" font-size="14" font-weight="650">整合導向</text>
  <rect x="1775" y="1420" width="104" height="34" rx="17" fill="#EAF7F1"/><text x="1827" y="1443" fill="#2F7D57" text-anchor="middle" font-family="PingFang TC, sans-serif" font-size="14" font-weight="650">圖譜意象</text>

  <line x1="90" y1="1560" x2="2310" y2="1560" stroke="#D7E1DC"/>
